name: Windows verification

# On demand only (workflow_dispatch): it proves one narrow thing, on a runner several times slower
# than the Linux jobs, so it runs when that thing may have changed -- before a release, or after a
# change to the watcher primitives. Trigger it with `gh workflow run windows.yml`.
#
# WHAT THIS PROVES THAT NO OTHER JOB CAN: supervise_daemon.py, watch_daemon.py and
# run_with_timeout.py's process-tree kill, on a real Windows host -- see tests/test_windows_real.py's
# own module docstring for what each test proves. That file skips itself everywhere else.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watchers-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - name: Watcher primitives, for real
        run: python -m pytest tests/test_windows_real.py -v --no-header
      - name: Live regression entrypoint refuses on Windows (no model, no network)
        shell: bash
        env:
          SIGMA_REGRESSION_LIVE: "1"
          SIGMA_REGRESSION_CAP_USD: "1"
          GITHUB_EVENT_NAME: workflow_dispatch
          ANTHROPIC_API_KEY: windows-probe
        run: |
          set +e
          env -u ANTHROPIC_API_KEY -u SIGMA_REGRESSION_LIVE -u SIGMA_REGRESSION_CAP_USD python evals/regression/live.py >out1.txt 2>err1.txt; rc1=$?
          python evals/regression/live.py >out2.txt 2>err2.txt; rc2=$?
          test "$rc1" -eq 2 && grep -q 'REFUSED \[no-credential\]' err1.txt && test ! -s out1.txt || exit 1
          test "$rc2" -eq 2 && grep -q 'REFUSED \[unsupported-platform\]' err2.txt && test ! -s out2.txt || exit 1
