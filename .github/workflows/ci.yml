name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: configure git identity for tests that create real commits
        run: |
          git config --global user.name "sigma-ci"
          git config --global user.email "sigma-ci@users.noreply.github.com"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip pytest
      - name: pytest
        run: python -m pytest tests/ -rs -q
      - name: quality gate (Tier-1 behavioral drift vs baseline)
        run: python3 evals/run.py
      - name: decision gate
        run: |
          python3 hooks/decision_gate.py validate .
          python3 hooks/decision_gate.py check .
      - name: SKILL.md frontmatter reads exactly as written (needs PyYAML)
        if: ${{ !cancelled() }}
        run: |
          python -m pip install pyyaml
          python -m pytest tests/test_skill_frontmatter_yaml.py -q
