name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"  # weekly full matrix

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    # pull_request and push to main run only the leg marked `pr: true`; every other leg still
    # reports (so the check names exist) but skips all steps in seconds. The full matrix runs
    # weekly (schedule) and on demand (workflow_dispatch). Ceiling: an Ubuntu or older-Python
    # break is found by the weekly run, up to a week after the merge that caused it.
    env:
      FULL: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || matrix.pr || false }}
    strategy:
      # Every leg runs to completion: without this, the first failing leg cancels the others and
      # a version-specific failure hides whether the other version is green (issue #241).
      fail-fast: false
      matrix:
        # These are the launch-supported cells, deliberately not a Cartesian product (#338).
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.12"
            pr: true
    steps:
      - if: ${{ env.FULL == 'true' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: configure git identity for tests that create real commits
        if: ${{ env.FULL == 'true' }}
        run: |
          git config --global user.name "sigma-ci"
          git config --global user.email "sigma-ci@users.noreply.github.com"
      - if: ${{ env.FULL == 'true' }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - if: ${{ env.FULL == 'true' }}
        run: python -m pip install --upgrade pip pytest
      - name: pytest
        if: ${{ env.FULL == 'true' }}
        run: python -m pytest tests/ -rs -q
      - name: no retired skill prefix left in any tracked path or file (#523)
        if: ${{ !cancelled() && env.FULL == 'true' }}
        run: python3 tools/rename_check.py
      - name: write-surface inventory ratchet
        if: ${{ env.FULL == 'true' }}
        run: python3 tools/readiness/write_surface.py check . docs/launch/write-surface.json
      - name: quality gate (Tier-1 behavioral drift vs baseline)
        if: ${{ env.FULL == 'true' }}
        run: python3 evals/run.py
      - name: decision gate
        if: ${{ env.FULL == 'true' }}
        run: |
          python3 hooks/decision_gate.py validate .
          python3 hooks/decision_gate.py check .
      - name: SKILL.md frontmatter reads exactly as written (needs PyYAML)
        if: ${{ !cancelled() && env.FULL == 'true' }}
        run: |
          python -m pip install pyyaml
          python -m pytest tests/test_skill_frontmatter_yaml.py -q
