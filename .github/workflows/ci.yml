name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      # Every leg runs to completion: without this, the first failing leg cancels the others and
      # a version-specific failure hides whether the other version is green (issue #241).
      fail-fast: false
      matrix:
        # These are the launch-supported cells, deliberately not a Cartesian product (#338).
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - name: configure git identity for tests that create real commits
        run: |
          git config --global user.name "sigma-ci"
          git config --global user.email "sigma-ci@users.noreply.github.com"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip pytest
      - name: pytest
        # The ubuntu 3.12 leg runs the same suite under coverage instead (next step): one leg, not five.
        if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.python == '3.12') }}
        run: python -m pytest tests/ -rs -q
      - name: pytest with the line-coverage floor (ubuntu 3.12 only; .coveragerc)
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python == '3.12' }}
        run: |
          python -m pip install "coverage==7.16.2"
          python -m coverage erase
          python -m coverage run -m pytest tests/ -rs -q
          python -m coverage combine
          python -m coverage report
      - name: write-surface inventory ratchet
        run: python3 tools/readiness/write_surface.py check . docs/launch/write-surface.json
      - name: quality gate (Tier-1 behavioral drift vs baseline)
        run: python3 evals/run.py
      - name: decision gate
        run: |
          python3 hooks/decision_gate.py validate .
          python3 hooks/decision_gate.py check .
      - name: SKILL.md frontmatter reads exactly as written (needs PyYAML)
        if: ${{ !cancelled() }}
        run: |
          python -m pip install pyyaml
          python -m pytest tests/test_skill_frontmatter_yaml.py -q
